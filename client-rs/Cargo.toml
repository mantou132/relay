[package]
name = "relay-client"
version = "0.1.0"
edition = "2024"
description = "Reliable WebSocket client for the durable relay server"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
