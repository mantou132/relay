[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "Durable, protocol-agnostic WebSocket message relay"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"

[[bin]]
name = "relay"
path = "src/main.rs"
