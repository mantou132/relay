[package]
name = "relay"
version = "0.1.0"
edition = "2024"
description = "Durable, protocol-agnostic WebSocket message relay"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
sea-orm = { version = "2.0.2", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"

[[bin]]
name = "relay"
path = "src/main.rs"
